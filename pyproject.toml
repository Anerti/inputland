[project]
name = "inputland"
version = "0.1.0"
description = "Control the mouse and desktop with hand gestures"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Anerti", email = "e.andrianombana@protonmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "evdev>=2.0.0",
    "mediapipe>=1.1.1",
    "opencv-contrib-python>=5.0.0.93",
    "pygobject>=3.58.1",
]

[project.scripts]
inputland = "inputland.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
